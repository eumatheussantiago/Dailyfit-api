# Configuração de deploy no Render (https://render.com)
# No painel do Render: New > Blueprint > escolha este repositório.
services:
  - type: web
    name: dailyfit
    runtime: python
    plan: free
    region: ohio            # mesma região do banco no Supabase (us-east-2)
    branch: master
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        sync: false         # o Render pede este valor na hora de criar
