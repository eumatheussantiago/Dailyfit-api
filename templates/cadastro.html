{% extends "base_app.html" %}

{% block titulo %}Criar conta{% endblock %}

{% block nav %}
<a href="/login" class="btn-login">Entrar</a>
{% endblock %}

{% block conteudo %}
<section class="auth-card">
    <div class="section-label">CRIAR CONTA</div>
    <h1>Comece sua <span>rotina hoje.</span></h1>
    <p class="auth-sub">Leva menos de um minuto e é gratuito.</p>

    <form id="form-cadastro" class="app-form" novalidate>
        <label for="nome">Nome</label>
        <input id="nome" name="nome" type="text" autocomplete="name" placeholder="Seu nome" required minlength="2">

        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" autocomplete="email" placeholder="voce@email.com" required>

        <p class="form-erro" id="erro" hidden></p>

        <button type="submit" class="btn-primary btn-full">Criar conta</button>
    </form>

    <p class="auth-troca">Já tem conta? <a href="/login">Entrar</a></p>
</section>
{% endblock %}

{% block scripts %}
<script>
    redirecionarSeLogado();

    document.getElementById("form-cadastro").addEventListener("submit", async (evento) => {
        evento.preventDefault();
        const form = evento.target;
        const botao = form.querySelector("button");
        esconderErro("erro");
        botao.disabled = true;

        try {
            const usuario = await api("/usuarios", {
                method: "POST",
                body: { nome: form.nome.value, email: form.email.value },
            });
            salvarUsuario(usuario);
            window.location.href = "/painel";
        } catch (erro) {
            mostrarErro("erro", erro.message);
            botao.disabled = false;
        }
    });
</script>
{% endblock %}
